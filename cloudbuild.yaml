steps:
# Step 1: Install dependencies and run the stats script
- name: 'gcr.io/cloud-builders/npm'
  dir: 'web-app'
  args: ['install']

- name: 'gcr.io/cloud-builders/npm'
  dir: 'web-app'
  args: ['run', 'fetch-stats']

# Step 2: Deploy the static files
- name: 'gcr.io/cloud-builders/gsutil'
  args: [
    '-m',
    'rsync',
    '-r',
    '-c',
    '-d',
    '-x', 'node_modules/|\.git/|package\.json|package-lock\.json|fetch-stats\.js',
    'web-app/',
    'gs://wedding-snipe-countdown-site'
  ]
options:
  logging: CLOUD_LOGGING_ONLY
