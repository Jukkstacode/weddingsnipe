<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-by-Game Fantasy Points Debugger</title>
    <link rel="stylesheet" href="debug_gamestats.css">
</head>
<body>
    <div class="container">
        <h1>Game-by-Game Fantasy Points Debugger (2024-2025)</h1>
        <div class="controls">
            <label for="player-select">Select a Player:</label>
            <select id="player-select">
                <option value="">-- Choose a Player --</option>
            </select>
        </div>
        <div id="loader" style="display: none;">Loading game log...</div>
        <table id="log-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Opponent</th>
                    <th>Decision</th>
                    <th>G</th>
                    <th>A</th>
                    <th>PIM</th>
                    <th>+/-</th>
                    <th>PPG</th> <th>PPA</th> <th>SHP</th>
                    <th>Saves</th>
                    <th>GA</th>
                    <th>TOI</th>
                    <th>Fantasy Pts</th>
                </tr>
            </thead>
            <tbody id="log-tbody">
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Season Totals</td>
                    <td id="total-g">0</td>
                    <td id="total-a">0</td>
                    <td id="total-pim">0</td>
                    <td id="total-pm">0</td>
                    <td id="total-ppg">0</td> <td id="total-ppa">0</td> <td id="total-shp">0</td>
                    <td id="total-saves">0</td>
                    <td id="total-ga">0</td>
                    <td>--</td>
                    <td id="cumulative-total">0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>
    <script src="debug_gamestats.js"></script>
</body>
</html>
