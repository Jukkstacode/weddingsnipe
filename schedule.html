<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/mike-favicon.jpeg" type="image/jpeg">
    <title>Bathouse Schedule</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="schedule.css">
    <link rel="stylesheet" href="hero-button.css">
    
    <!-- ADD THESE FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="gm-list-container">
        <h1>Bathouse Hockey League </br> 2025 Schedule</h1>
        
        <!-- UPDATED: Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="gm-filter">Filter by GM:</label>
                <select id="gm-filter">
                    <option value="all">All Matchups</option>
                </select>
            </div>
            
            <!-- NOTE: Spicy filter won't work anymore since we didn't migrate isSpecial -->
            <div class="filter-group spicy-filter">
                <label class="spicy-checkbox-label">
                    <input type="checkbox" id="spicy-filter">
                    <span class="spicy-text">🔥 Spicy Matchups Only</span>
                </label>
            </div>
        </div>
        
        <div id="schedule-container">
        </div>
    </div>
    <script src="nav.js"></script>
    <script src="schedule.js"></script>
    <script src="hero-button.js"></script>
</body>
</html>
