<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Points Over Time</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container">
        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-controls">
                    <div class="controls-row">
                        <button id="updateChartBtn">
                            <span class="btn-label">Update</span>
                            <span class="btn-spinner"></span>
                        </button>
                        <button id="clearBtn">Clear</button>
                        <label class="toggle-label" for="rfaFilter">
                            <input type="checkbox" id="rfaFilter">
                            <span>RFAs</span>
                        </label>
                        <div class="controls-legend">
                            <span class="legend-item"><span class="legend-circle"></span> Played</span>
                            <span class="legend-item"><span class="legend-diamond">&#9670;</span> Missed</span>
                        </div>
                    </div>
                </div>
                <div class="player-search-container">
                    <input type="text" id="playerSearch" placeholder="Search any NHL player..." autocomplete="off">
                    <div id="searchResults" class="search-results"></div>
                </div>
                <div class="season-header">
                    <div class="gm-info-placeholder"></div>
                    <div class="season-labels" id="seasonLabels"></div>
                </div>
                <div id="player-selection-list" class="player-list"></div>
            </aside>
            <div class="chart-area">
                <div class="chart-container">
                    <canvas id="goalsChart"></canvas>
                </div>
                <div class="chart-empty-state" id="chartEmptyState">
                    <div class="empty-icon">&#9898;</div>
                    <p>Select players from the sidebar and click <strong>Update Chart</strong> to compare fantasy production.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        fetch('../nav.html')
            .then(r => r.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const hamburger = document.querySelector('.hamburger');
                const navLinks = document.querySelector('.nav-links');
                if (hamburger && navLinks) {
                    hamburger.addEventListener('click', () => navLinks.classList.toggle('nav-active'));
                }
                // Fix nav links to point to parent directory
                document.querySelectorAll('.top-nav a[href]').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('../')) {
                        a.setAttribute('href', '../' + href);
                    }
                });
            });
    </script>
    <script src="script.js"></script>
</body>
</html>
