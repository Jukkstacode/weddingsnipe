<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Points Over Time</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container">
        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-controls">
                    <div class="controls-row">
                        <button id="updateChartBtn">
                            <span class="btn-label">Update</span>
                            <span class="btn-spinner"></span>
                        </button>
                        <button id="clearBtn">Clear</button>
                        <div class="controls-legend">
                            <span class="legend-item"><span class="legend-circle"></span> Played</span>
                            <span class="legend-item"><span class="legend-diamond">&#9670;</span> Missed</span>
                        </div>
                    </div>
                </div>
                <div class="position-filters">
                    <button class="pos-filter active" data-pos="ALL">All</button>
                    <button class="pos-filter" data-pos="C">C</button>
                    <button class="pos-filter" data-pos="LW">LW</button>
                    <button class="pos-filter" data-pos="RW">RW</button>
                    <button class="pos-filter" data-pos="D">D</button>
                    <button class="pos-filter" data-pos="G">G</button>
                    <button class="rfa-filter" id="rfaFilter">RFA</button>
                    <span class="filter-separator"></span>
                    <div id="seasonToggles" class="season-toggles"></div>
                </div>
                <div class="player-search-container">
                    <input type="text" id="playerSearch" placeholder="Search any NHL player..." autocomplete="off">
                    <div id="searchResults" class="search-results"></div>
                </div>
                <div id="player-selection-list" class="player-list"></div>
            </aside>
            <div class="chart-area">
                <div class="chart-flip-inner">
                    <div class="chart-flip-front">
                        <div class="chart-container">
                            <canvas id="goalsChart"></canvas>
                        </div>
                        <div class="chart-inset" id="chartInset"></div>
                        <div class="chart-empty-state" id="chartEmptyState">
                            <div class="empty-icon">&#9898;</div>
                            <p>Select players from the sidebar and click <strong>Update Chart</strong> to compare fantasy production.</p>
                        </div>
                    </div>
                    <div class="chart-flip-back" id="chartFlipBack"></div>
                </div>
                <button class="chart-flip-btn" id="chartFlipBtn" title="Show FP/G stats">FP/G</button>
            </div>
        </div>
    </div>
    <script src="../nav.js"></script>
    <script src="script.js"></script>
</body>
</html>
