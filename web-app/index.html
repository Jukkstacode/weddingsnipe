<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bathouse Hockey League</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main>
    <section class="countdown" id="countdown">
      <p class="eyebrow">Draft night</p>
      <div class="clock" id="clock"></div>
      <p class="muted" id="draft-when"></p>
    </section>
    <p class="muted" id="updated"></p>
  </main>
  <script src="js/nav.js"></script>
  <script type="module">
    import { DRAFT_AT } from './js/league.js';

    const units = [['d', 86400], ['h', 3600], ['m', 60], ['s', 1]];
    document.getElementById('draft-when').textContent = DRAFT_AT.toLocaleString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
    });
    function tick() {
      let left = Math.max(0, Math.floor((DRAFT_AT - Date.now()) / 1000));
      if (!left) {
        document.getElementById('clock').innerHTML = '<span class="unit"><b>Draft is live</b></span>';
        return;
      }
      document.getElementById('clock').innerHTML = units.map(([label, secs]) => {
        const n = Math.floor(left / secs); left -= n * secs;
        return `<span class="unit"><b>${String(n).padStart(2, '0')}</b><small>${label}</small></span>`;
      }).join('');
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();

    const res = await fetch('data/player-stats.json');
    if (res.ok) {
      const { updatedAt, players } = await res.json();
      document.getElementById('updated').textContent =
        `Stats for ${Object.keys(players).length} players, updated ${new Date(updatedAt).toLocaleString()}`;
    }
  </script>
</body>
</html>
