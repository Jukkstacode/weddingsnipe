<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bathouse Hockey League</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main>
    <h1>Bathouse Hockey League</h1>
    <p>Site v2 is under construction. The full <a href="v1/index.html">old site</a> is still here.</p>
    <p class="muted" id="updated"></p>
  </main>
  <script src="js/nav.js"></script>
  <script type="module">
    const res = await fetch('data/player-stats.json');
    if (res.ok) {
      const { updatedAt, players } = await res.json();
      document.getElementById('updated').textContent =
        `Stats for ${Object.keys(players).length} players, updated ${new Date(updatedAt).toLocaleString()}`;
    }
  </script>
</body>
</html>
